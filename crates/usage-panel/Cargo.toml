[package]
name = "usage-panel"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "light-usage-panel"
path = "src/main.rs"

[dependencies]
usage-display = { path = "../usage-display" }
chrono = { version = "=0.4.42", default-features = false, features = ["std"] }

[target.'cfg(target_os = "macos")'.dependencies]
gpui = { version = "=0.2.2", default-features = false, features = ["font-kit"] }
async-channel = "=2.5.0"
objc2 = "=0.6.5"
objc2-foundation = "=0.3.2"
objc2-app-kit = { version = "=0.3.2", features = ["block2"] }
block2 = "=0.6.2"
