[package]
name = "usage-providers"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
usage-core = { path = "../usage-core" }
base64 = "=0.22.1"
chrono = { version = "=0.4.42", default-features = false, features = ["std"] }
futures-util = { version = "=0.3.31", features = ["sink"] }
httpdate = "=1.0.3"
log = { version = "=0.4.34", features = ["max_level_info", "release_max_level_info"] }
reqwest = { version = "=0.12.24", default-features = false, features = ["rustls-tls", "stream"] }
serde_json = "=1.0.145"
sha2 = "=0.10.9"
tokio = { version = "=1.48.0", features = ["rt-multi-thread", "macros", "time", "fs", "io-util", "process", "sync"] }
tokio-tungstenite = { version = "=0.28.0", features = ["rustls-tls-webpki-roots"] }

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "=3.5.1"
libc = "=0.2.191"
libproc = "=0.14.11"

[dev-dependencies]
tokio = { version = "=1.48.0", features = ["test-util"] }
